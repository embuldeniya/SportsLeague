<h3>Find a League </h3>




<form>


    <div class="form-group row">
        <label class="col-sm-2 col-form-label" >Latitude:</label>
        <div class="col-sm-3">
        <input  class="form-control" placeholder="latitude" #latitude />
        </div>
        <label class="col-sm-2 col-form-label" >Longitude:</label>
        <div class="col-sm-3">
        <input  class="form-control" placeholder="longitude" #longitude/>
        </div>
    </div>
    <div class="form-group row">
        <label class="col-sm-2 col-form-label" >Radius in miles :</label>
        <div class="col-sm-8">
        <input  class="form-control" placeholder="radius" #radius/>
        </div>
    </div>

  

    <div class="form-group row">
        <label class="col-sm-2 col-form-label" >Total Budget ($): </label>
        <div class="col-sm-8">
        <input type="number" class="form-control" placeholder="budget" #budget/>
        </div>
    </div>
    <div class = "button-option">
    <button class="btn btn-primary" button (click) = "onSearch(latitude.value,longitude.value, radius.value, budget.value); latitude.value = ''; longitude.value = ''; radius.value= ''; budget.value= '' ">Search</button>
    </div>
</form> 
<br>

<div class = "result">

    {{result}}
</div>


<p>

    {{results}}
</p>


<br>


<div *ngIf= "league?.length> 0; else noLeagues"> 

<table style="width:100%"  >
    <tr > 
      <th>Name of the Sports League</th>
      <th>Sponsorship Price</th> 
     </tr>
    <tr *ngFor= "let league of league" >
       
      <td> {{league.league_name}}</td>
      <td>{{league.Price}}</td>
 
    
  </table>

</div>
<ng-template #noLeagues>


    <div class = "result">

    Click on the search Box 
    </div>
    
</ng-template>
