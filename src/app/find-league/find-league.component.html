<h3>Find a League </h3>




<form>


    <div class="form-group row">
        <label class="col-sm-2 col-form-label" >Latitude:</label>
        <div class="col-sm-3">
        <input  class="form-control" placeholder="latitude"/>
        </div>
        <label class="col-sm-2 col-form-label" >Longitude:</label>
        <div class="col-sm-3">
        <input  class="form-control" placeholder="longitude"/>
        </div>
    </div>
    <div class="form-group row">
        <label class="col-sm-2 col-form-label" >Radius in Miles :</label>
        <div class="col-sm-8">
        <input  class="form-control" placeholder="radius"/>
        </div>
    </div>

  

    <div class="form-group row">
        <label class="col-sm-2 col-form-label" >Total Budget: </label>
        <div class="col-sm-8">
        <input  class="form-control" placeholder="budget"/>
        </div>
    </div>
    <div class = "button-option">
    <button class="btn btn-primary" type="search">Search</button>
    </div>
</form> 


<p>

results

</p>

<ul *ngFor= "let league of league">
    <li>{{league.league_name}} :  {{league.Price}} </li>
    





</ul>
