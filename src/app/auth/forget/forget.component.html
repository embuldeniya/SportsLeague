<h3>Password Reset</h3>

<form #passwordResetForm="ngForm" (ngSubmit)="reset(passwordResetForm)">
    <div class="row" *ngIf="authError">
        <div class="col-12 alert alert-danger">{{ authError?.message }}</div>
      </div>

      <div class="form-group row">
          
        <label class="col-sm-3 col-form-label" for="email">Please enter your email</label>
        <div class="col-sm-6">
        <input  ngModel #email="ngModel" name="email" type="email" class="form-control">
    </div>
      
     </div>


     <div class="colum">
        <button class="btn btn-success" type="submit">Reset</button>
      </div>

</form>
