<h3>User Registration</h3>

      <form #userRegForm="ngForm" (ngSubmit)="createUser(userRegForm)">
        
        <div class="row" *ngIf="authError">
          <div class="col-12 alert alert-danger">
            {{ authError?.message }} </div>
        
        </div>
             
        
        
        <div class="form-group row">
        
            <label class="col-sm-2 col-form-label"for="firstName">First Name</label>
            <div class="col-sm-3">
            <input ngModel #firstname="ngModel" name="firstName" type="text" class="form-control" id="firstName">
            </div>
         
            <label  class="col-sm-2 col-form-label" for="lastName">Last Name</label>
            <div class="col-sm-3">
            <input ngModel #lastname="ngModel" name="lastName" type="text" class="form-control" id="lastName" value="">
          </div>
         
        </div>
        
        <div class="form-group row">
          
            <label class="col-sm-2 col-form-label" for="email">Email</label>
          <div class="col-sm-8">
            <input ngModel #email="ngModel" name="email" type="email" class="form-control">
          </div>
        </div>

        
        <div class="form-group row">
            
              <label class="col-sm-2 col-form-label" for="password">Password</label>
              <div class="col-sm-8">
              <input ngModel #password="ngModel" name="password" type="password" class="form-control">
            </div>
          </div>


       
        
            <div class="colum">
              <button class="btn btn-success" type="submit">Submit</button>
            </div>
        
        
      </form>
